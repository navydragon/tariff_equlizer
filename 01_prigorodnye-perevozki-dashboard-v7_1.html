<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пригородные пассажирские перевозки — аналитический дашборд по субъектам РФ</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F4F6F8; --tint:#FAFBFC;
  --line:#E3E8ED; --line2:#C9D2DA; --ink:#141C24; --mute:#66788A;
  --amber:#B26A05; --amberBg:#E9A72C; --ok:#17784A; --bad:#B4382B;
  --auto:#C77A0A; --rail:#C0392B; --water:#1B7BA6; --priv:#64798C; --air:#7A5BA6;
  --display:"Roboto Condensed","Arial Narrow",Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(178,106,5,.35)}
a:hover{border-bottom-color:var(--amber)}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#F7F9FB}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--line)}
.brand .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.15em;font-size:10px;color:var(--mute)}
.brand .t{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:19px;line-height:1.05;margin-top:6px;color:var(--ink)}
nav.pages{display:flex;flex-direction:column;padding:8px 0}
nav.pages button{background:none;border:none;border-left:2px solid transparent;color:var(--mute);text-align:left;
  padding:8px 18px;font-size:13px;cursor:pointer;font-family:var(--body);display:flex;gap:10px;align-items:baseline}
nav.pages button span.i{font-family:var(--mono);font-size:10.5px;opacity:.6;min-width:14px}
nav.pages button:hover{color:var(--ink);background:#EDF1F5}
nav.pages button[aria-current="true"]{color:var(--ink);border-left-color:var(--amberBg);background:#EDF1F5;font-weight:600}
nav.pages .grp{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:9.5px;color:#93A3B1;padding:15px 18px 5px}
main{min-width:0;padding:22px 26px 70px;max-width:1440px}
.ph{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.ph h1{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:clamp(20px,2.6vw,30px);margin:0;letter-spacing:.01em}
.ph p{color:var(--mute);margin:6px 0 0;max-width:80ch;line-height:1.5;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:0 0 16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-size:10px;color:var(--mute)}
select,button.ghost,input[type=text]{font-family:var(--body);font-size:13px;color:var(--ink);background:#FFF;
  border:1px solid var(--line2);padding:7px 10px;border-radius:2px;outline:none}
select{max-width:280px}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;background:#FFF}
.seg button{border:none;background:transparent;color:var(--ink);padding:7px 11px;cursor:pointer;font-size:12.5px;font-family:var(--body)}
.seg button[aria-pressed="true"]{background:var(--amberBg);color:#2A1E05;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#FFF;color:var(--mute);
  padding:6px 10px;border-radius:2px;cursor:pointer;font-size:12.5px;font-family:var(--body)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--panel2);border-color:var(--line2);font-weight:500}
.chip[aria-pressed="false"] i{opacity:.25}
button.ghost{cursor:pointer}
button.ghost:hover{border-color:var(--amber);color:var(--amber)}
.tablo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:16px}
.cell{background:var(--tint);padding:13px 14px 11px;position:relative;min-width:0}
.cell .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(17px,2.1vw,26px);color:var(--amber);
  margin-top:7px;letter-spacing:-.02em}
.cell .unit{font-family:var(--display);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.cell .dlt{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.cell .dlt.up{color:var(--ok)}.cell .dlt.dn{color:var(--bad)}
.q{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:1px 4px;border-radius:2px;vertical-align:1px;margin-left:5px;letter-spacing:.04em}
.q.f{background:#E6F4EC;color:#12643D;border:1px solid #BFE0CE}
.q.r{background:#FBF2DC;color:#7C5C08;border:1px solid #E8D5A4}
.q.o{background:#F0EAF7;color:#5B3E86;border:1px solid #D8CBEA}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g32{grid-template-columns:1.5fr 1fr}
.g23{grid-template-columns:1fr 1.5fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:15px 15px 11px;min-width:0}
.card h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;margin:0 0 2px}
.card .note{color:var(--mute);font-size:12px;margin:0 0 11px;line-height:1.45}
svg{display:block;width:100%;height:auto;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
.legend i{width:10px;height:3px;border-radius:2px}
.share{display:flex;height:24px;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px}
.share div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:#FFF;min-width:0}
.shrow{display:grid;grid-template-columns:12px 1fr auto 54px;gap:9px;align-items:baseline;font-size:12.5px;padding:3px 0}
.shrow i{width:9px;height:9px;border-radius:50%}
.shrow b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shrow s{text-decoration:none;color:var(--mute);font-family:var(--mono);font-size:11.5px;text-align:right}
.route{position:relative;padding-left:26px;max-height:640px;overflow-y:auto}
.route:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.stop{position:relative;display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:11px;align-items:center;padding:5px 0}
.stop:before{content:"";position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;
  background:#FFF;border:2px solid var(--amberBg)}
.stop.big:before{width:14px;height:14px;left:-26px}
.stop .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .tr{height:8px;background:var(--panel2);border-radius:1px;overflow:hidden}
.stop .tr i{display:block;height:100%;background:var(--amberBg)}
.stop .vl{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:74px;text-align:right}
.stop.me{background:#FBF3E2}.stop.me .nm{color:var(--amber);font-weight:600}
.tw{overflow:auto;max-height:600px;border:1px solid var(--line);border-radius:2px}
.tw.short{max-height:none}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:#FFF}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--tint);font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
  font-size:10px;color:var(--mute);cursor:pointer;z-index:2;border-bottom:1px solid var(--line2)}
th.nos{cursor:default}
th:hover{color:var(--ink)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--tint);z-index:1}
td:first-child{background:#FFF}
tbody tr:hover td{background:#F5F8FA}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:220px}
tfoot td{background:var(--tint);font-weight:600;border-top:1px solid var(--line2)}
footer{margin-top:34px;border-top:1px solid var(--line);padding-top:18px;color:var(--mute);font-size:12.5px;line-height:1.6}
.callout{border:1px solid #E7D3A3;background:#FDF8EC;color:#6A4C0C;padding:11px 13px;font-size:12.5px;line-height:1.55;border-radius:2px;margin-bottom:16px}
.callout b{color:#8A5C04}
.note-in{border:1px solid var(--line);background:var(--panel2);padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--mute);border-radius:2px}
ul.tight{margin:0 0 10px;padding-left:17px;line-height:1.55}
ul.tight li{margin-bottom:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
h4.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;margin:22px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--mute);margin:0 5px 5px 0;background:#FFF}
@media (max-width:1080px){.g2,.g32,.g23,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:0;z-index:20;height:auto;border-right:none;border-bottom:1px solid var(--line);
    padding:0 0 0;background:#F7F9FB}
  .brand{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .brand .t{font-size:16px}
  .brand .t br{display:none}
  nav.pages{flex-direction:row;overflow-x:auto;padding:5px 8px;gap:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  nav.pages .grp{display:none}
  nav.pages button{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:9px 11px;border-radius:2px}
  nav.pages button span.i{display:none}
  nav.pages button[aria-current="true"]{border-bottom-color:var(--amberBg)}
  main{padding:14px 12px 56px}
}
@media (max-width:760px){
  html,body{font-size:13.5px}
  .ph{padding-bottom:11px;margin-bottom:12px}
  .ph p{font-size:12.5px}
  .grid{gap:12px}
  .card{padding:13px 12px 9px}
  .bar{gap:10px;padding-bottom:12px}
  .fld{flex:1 1 100%;min-width:0}
  select{max-width:none;width:100%}
  .seg{width:100%}.seg button{flex:1 1 0;text-align:center;padding:8px 6px}
  .chips{width:100%}
  .chip{flex:1 1 44%;justify-content:center;padding:8px 6px;font-size:12px}
  .tablo{grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
  .cell{padding:11px 11px 9px}
  .cell .val{font-size:20px;margin-top:5px}
  .cell .lab{white-space:normal}
  .cell .dlt{position:static;display:block;margin-top:4px}
  .tw{max-height:70vh;-webkit-overflow-scrolling:touch}
  th,td{padding:6px 8px;font-size:11.5px}
  td.w,th.nos{min-width:0}
  td.w{min-width:150px}
  .route{padding-left:20px;max-height:420px}
  .route:before{left:5px}
  .stop{grid-template-columns:minmax(84px,1.1fr) minmax(40px,1fr) auto;gap:8px;padding:6px 0}
  .stop:before{left:-20px;width:8px;height:8px}
  .stop.big:before{left:-22px;width:11px;height:11px}
  .stop .nm{font-size:11.5px}
  .stop .vl{font-size:11.5px;min-width:58px}
  .shrow{grid-template-columns:11px 1fr auto 46px;gap:7px;font-size:12px}
  .legend{gap:9px}.legend span{font-size:11px}
  .callout,.note-in{font-size:12px;padding:10px 11px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dt{margin-top:6px}
  ul.tight{padding-left:15px}
  .scrollhint{display:block}
}
.scrollhint{display:none;font-size:11px;color:var(--mute);margin:0 0 6px;font-family:var(--display);
  text-transform:uppercase;letter-spacing:.08em}
@media (prefers-reduced-motion:no-preference){.stop .tr i{transition:width .3s ease}}
@media print{aside{display:none}.app{grid-template-columns:1fr}.tw{max-height:none;overflow:visible}}

/* ═════ окно редактора исходных данных ═════ */
.ed-fab{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--amberBg);color:#2A1E05;
  border:1px solid #C7920F;padding:10px 15px;border-radius:2px;cursor:pointer;font-family:var(--body);
  font-size:13px;font-weight:600;box-shadow:0 5px 16px rgba(20,28,36,.20)}
.ed-fab:hover{background:#DDA02A}
.ed-wrap{position:fixed;inset:0;z-index:70;background:rgba(20,28,36,.45);display:flex;padding:22px}
.ed-wrap[hidden]{display:none}
.ed-win{background:#FFF;border:1px solid var(--line2);width:min(1400px,100%);margin:0 auto;display:flex;
  flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(20,28,36,.38)}
.ed-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line);
  background:var(--tint)}
.ed-head h2{font-family:var(--display);text-transform:uppercase;font-size:16px;margin:0;letter-spacing:.04em}
.ed-head .sub{font-size:11.5px;color:var(--mute);margin-top:4px;max-width:60ch;line-height:1.45}
.ed-body{overflow:auto;padding:14px 16px;flex:1;background:var(--panel2)}
.ed-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);
  background:var(--tint);font-size:12px;color:var(--mute)}
.ed-hint{border:1px solid var(--line);background:#FFF;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--mute);margin-bottom:12px;border-radius:2px}
.ed-x{border:1px solid var(--line2);background:#FFF;color:var(--ink);cursor:pointer;font-size:15px;
  line-height:1;padding:8px 12px;border-radius:2px;font-family:var(--body)}
.ed-x:hover{border-color:var(--bad);color:var(--bad)}
button.ghost.xs{padding:2px 7px;font-size:12px;min-width:26px}
button.ghost.pri{background:var(--amberBg);border-color:#C7920F;color:#2A1E05;font-weight:600}
button.ghost.pri:hover{background:#DDA02A;color:#2A1E05}
.ed-body .tw{max-height:none;background:#FFF}
td.ed{padding:0;background:#FFFCF2}
td.ed input,td.ed select{width:100%;border:none;background:transparent;color:#6A4C0C;font-family:var(--mono);
  font-size:12.5px;text-align:right;padding:7px 10px;font-weight:600;border-radius:0;max-width:none}
td.ed.txt input{text-align:left;font-family:var(--body);font-weight:400;color:var(--ink)}
td.ed select{font-family:var(--body);text-align:left;font-weight:500}
td.ed input:focus,td.ed select:focus{outline:2px solid var(--amber);outline-offset:-2px;background:#FFF}
td.ro{color:var(--mute)}
@media (max-width:760px){.ed-wrap{padding:0}.ed-fab{right:10px;bottom:10px;padding:9px 12px}
  td.ed input,td.ed select{font-size:16px}}
@media print{.ed-fab,.ed-wrap{display:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="k">Аналитический дашборд</div><div class="t">Пригородные<br>пассажирские<br>перевозки</div></div>
  <nav class="pages" id="nav"></nav>
</aside>
<main id="main"></main>
</div>

<button class="ed-fab" id="edFab" type="button" title="Открыть редактор исходных данных">✎ Редактор данных</button>

<div class="ed-wrap" id="edWrap" hidden>
  <div class="ed-win">
    <div class="ed-head">
      <div style="flex:1;min-width:220px">
        <h2>Редактор исходных данных</h2>
        <div class="sub">Правится всё, что не считается формулами. Страницы дашборда пересчитываются сразу.
          Окно закрывается крестиком, кнопкой «Закрыть» или клавишей Esc.</div>
      </div>
      <label class="fld"><span>Справочник</span><select id="edPick" style="max-width:340px"></select></label>
      <label class="fld"><span>Поиск</span><input type="text" id="edQ" placeholder="часть текста, затем Enter"></label>
      <div class="fld"><span>&nbsp;</span><button class="ghost" id="edAdd" type="button">Добавить строку</button></div>
      <div class="fld"><span>&nbsp;</span><button class="ghost" id="edCsv" type="button">Скачать CSV</button></div>
      <div class="fld"><span>&nbsp;</span><button class="ed-x" id="edClose" type="button" title="Закрыть окно (Esc)">✕</button></div>
    </div>
    <div class="ed-body" id="edBody"></div>
    <div class="ed-foot">
      <span id="edCount">Правок нет</span>
      <div style="flex:1"></div>
      <button class="ghost pri" id="edSave" type="button">Сохранить дашборд с правками</button>
      <button class="ghost" id="edClose2" type="button">Закрыть</button>
    </div>
  </div>
</div>

<script id="edits">const EDITS=null;</script>

<script>
/* =====================================================================
   1. СПРАВОЧНИКИ
   ===================================================================== */
const MODES=[
 {id:'auto', n:'Автомобильный',   c:'#C77A0A', park:'автобусы на пригородных маршрутах, ед.'},
 {id:'rail', n:'Железнодорожный', c:'#C0392B', park:'вагоны МВПС пригородного парка, ед.'},
 {id:'water',n:'Водный',          c:'#1B7BA6', park:'пассажирские суда, ед.'},
 {id:'priv', n:'Личный',          c:'#64798C', park:'легковые автомобили, ед.'},
 {id:'air',  n:'Авиационный',     c:'#7A5BA6', park:'воздушные суда на местных линиях, ед.'}
];
const M=Object.fromEntries(MODES.map(m=>[m.id,m]));
const YEARS=[2021,2022,2023,2024,2025,2026];
const LASTM={2021:12,2022:12,2023:12,2024:12,2025:12,2026:6};
const MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

/* n=субъект, d=ФО, p=население, млн; r/w/a — индексы наличия пригородного ЖД, водного, местной авиации; ci — индекс уровня затрат */
const REGIONS=[
 ['Белгородская область','ЦФО',1.51,.30,.02,0,.92],['Брянская область','ЦФО',1.16,.45,.02,0,.90],
 ['Владимирская область','ЦФО',1.32,.85,.05,0,.95],['Воронежская область','ЦФО',2.28,.40,.05,0,.93],
 ['Ивановская область','ЦФО',0.96,.55,.08,0,.94],['Калужская область','ЦФО',1.07,1.05,.02,0,.98],
 ['Костромская область','ЦФО',0.61,.30,.10,.05,.96],['Курская область','ЦФО',1.08,.35,.02,0,.91],
 ['Липецкая область','ЦФО',1.11,.30,.02,0,.92],['Московская область','ЦФО',8.65,4.20,.06,0,1.18],
 ['Орловская область','ЦФО',0.71,.30,.02,0,.90],['Рязанская область','ЦФО',1.06,.75,.06,0,.95],
 ['Смоленская область','ЦФО',0.90,.55,.03,0,.94],['Тамбовская область','ЦФО',0.98,.25,.02,0,.90],

const CURMIX={'ЦФО':{dc:.80,ac:.10,dsl:.10},'СЗФО':{dc:.70,ac:.08,dsl:.22},'ЮФО':{dc:.22,ac:.68,dsl:.10},

 'СФО':{dc:.26,ac:.59,dsl:.15},'ДФО':{dc:.14,ac:.60,dsl:.26}};
function curMix(ri){const R=REGIONS[ri],b=CURMIX[R.d]||{dc:.5,ac:.4,dsl:.1};
  const k=Math.min(.22,Math.max(0,(R.ci-1)*.35));  /* в дорогих/северных регионах больше дизельной тяги */
  return {dc:b.dc*(1-k),ac:b.ac*(1-k),dsl:b.dsl+ (b.dc+b.ac)*k}}
/* серии с ограниченной географией эксплуатации распределяются только по своим регионам,
   внутри каждого типа тяги веса нормируются заново — сумма всегда равна парку региона */
const eligible=(ri,t)=>SERIES.filter(x=>x.t===t&&(!x.only||x.only.includes(REGIONS[ri].n)||x.only.includes(REGIONS[ri].d)));
function parkBySeries(regs,y){
  const out={};SERIES.forEach(x=>out[x.s]=0);
  for(const ri of regs){const park=cell(ri,'rail',y,LASTM[y]).park,mix=curMix(ri);
    for(const t of ['dc','ac','dsl']){const sub=park*mix[t],el=eligible(ri,t),sw=el.reduce((a,x)=>a+x.w,0)||1;
      el.forEach(x=>out[x.s]+=sub*x.w/sw)}}
  return out}

   3. МОДЕЛЬ РАСПРЕДЕЛЕНИЯ ПО СУБЪЕКТАМ
   ===================================================================== */
function h32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const u=s=>((h32(s)>>>8)&0xFFFF)/0xFFFF;
const SEAS={
 auto:[.88,.86,.95,1.00,1.05,1.08,1.05,1.08,1.12,1.05,.95,.93],
 rail:[.74,.74,.86,1.00,1.20,1.32,1.28,1.25,1.18,1.00,.84,.79],
 water:[0,0,0,.20,1.00,1.60,1.90,1.80,1.10,.30,0,0],
 priv:[.80,.80,.90,1.00,1.15,1.26,1.32,1.28,1.10,1.00,.90,.85],
 air:[.90,.85,.90,.95,1.05,1.15,1.25,1.25,1.05,1.00,.90,.95]
};
const IDX={auto:null,rail:'r',water:'w',air:'a',priv:null};
/* базовый вес субъекта в объёме перевозок данным видом транспорта */
function wPax(ri,mid){const R=REGIONS[ri];const k=IDX[mid]?R[IDX[mid]]:1;
  return R.p*k*(.85+.30*u(R.n+mid+'w'))}
/* вес в бюджетной поддержке: объём × удельная затратность региона */
function wSub(ri,mid){const R=REGIONS[ri];return wPax(ri,mid)*R.ci*(.65+.70*u(R.n+mid+'s'))}
function wPark(ri,mid){const R=REGIONS[ri];return wPax(ri,mid)*(.85+.3*u(R.n+mid+'p'))*(mid==='priv'?1/Math.max(R.ci,.5):1)}
const kTar=(ri,mid)=>REGIONS[ri].ci*(.86+.28*u(REGIONS[ri].n+mid+'t'));
const kDist=(ri,mid)=>(.75+.55*u(REGIONS[ri].n+mid+'d'));
/* SUM.tar / SUM.dist — средневзвешенные множители: нужны, чтобы взвешенное среднее
   по субъектам совпадало с федеральным якорем тарифа и средней дальности */
/* Федеральная поддержка ж/д пригорода — это компенсация скидки 99 % на услуги инфраструктуры,
   она пропорциональна объёму работы (пассажиро-километрам), а не выпадающим доходам.
   Региональная — компенсация потерь в доходах, пропорциональна объёму и уровню затрат. */
const wFed=(ri,mid)=>mid==='rail'?wPax(ri,mid)*kDist(ri,mid):wSub(ri,mid);
function buildSUM(){const o={};for(const m of MODES.map(x=>x.id)){o[m]={pax:0,sub:0,fed:0,park:0,tar:0,dist:0};
  REGIONS.forEach((_,i)=>{const w=wPax(i,m);o[m].pax+=w;o[m].sub+=wSub(i,m);o[m].fed+=wFed(i,m);o[m].park+=wPark(i,m);
    o[m].tar+=w*kTar(i,m);o[m].dist+=w*kDist(i,m)});
  o[m].tar=o[m].pax>0?o[m].tar/o[m].pax:1; o[m].dist=o[m].pax>0?o[m].dist/o[m].pax:1}return o}
let SUM=buildSUM();

let OVERRIDE=null;               // сюда попадают загруженные пользователем данные
const cache=new Map();
function cell(ri,mid,y,m){
  const key=ri+'|'+mid+'|'+y+'|'+m;
  if(OVERRIDE){const k2=ri+'|'+mid+'|'+y+'|'+m;if(OVERRIDE.has(k2))return OVERRIDE.get(k2)}
  if(cache.has(key))return cache.get(key);
  const A=ANCHOR[mid], R=REGIONS[ri], seas=SEAS[mid], nm=LASTM[y];
  let sSeas=0;for(let i=0;i<nm;i++)sSeas+=seas[i];
  const sh=seas[m-1]/(sSeas||1);
  const shPax=wPax(ri,mid)/SUM[mid].pax, shSub=wSub(ri,mid)/SUM[mid].sub,
        shFed=wFed(ri,mid)/SUM[mid].fed, shPark=wPark(ri,mid)/SUM[mid].park;
  const pax=(A.pax[y]||0)*1000*shPax*sh;                                  // тыс. пасс. за месяц
  const fed=(A.fed[y]||0)*1000*shFed*sh, reg=(A.reg[y]||0)*1000*shSub*sh;  // млн руб. за месяц
  const park=Math.round((A.park[y]||0)*shPark);                            // наличие ТС, ед.
  const dist=(A.dist[y]||1)*kDist(ri,mid)/SUM[mid].dist;                   // км
  const tar=(A.tar[y]||0)*kTar(ri,mid)/SUM[mid].tar;                       // руб./поездка
  const o={pax,fed,reg,sub:fed+reg,park,dist,tar,pkm:pax*dist/1000};       // pkm — млн пасс.-км
  cache.set(key,o);return o;
}
function agg(regs,mid,y,months){
  let pax=0,fed=0,reg=0,park=0,pkm=0,tw=0;
  for(const ri of regs)for(const mm of months){const c=cell(ri,mid,y,mm);
    pax+=c.pax;fed+=c.fed;reg+=c.reg;park+=c.park/months.length;pkm+=c.pkm;tw+=c.tar*c.pax}
  const sub=fed+reg;
  return {pax,fed,reg,sub,park:Math.round(park),pkm,
    tar:pax>0?tw/pax:0,
    unit:pax>0?sub*1e6/(pax*1e3):0,                 // руб. поддержки на 1 пасс.
    unit10:pkm>0?sub*1e6/(pkm*1e6)*10:0,            // руб. поддержки на 10 пасс.-км
    dist:pax>0?pkm*1e6/(pax*1e3)/1000*1000:0,
    cover:0};
}
function aggMulti(regs,mids,y,months){
  const parts=mids.map(id=>({id,...agg(regs,id,y,months)}));
  const t=parts.reduce((a,p)=>({pax:a.pax+p.pax,fed:a.fed+p.fed,reg:a.reg+p.reg,sub:a.sub+p.sub,
    park:a.park+p.park,pkm:a.pkm+p.pkm,tw:a.tw+p.tar*p.pax}),{pax:0,fed:0,reg:0,sub:0,park:0,pkm:0,tw:0});
  t.tar=t.pax>0?t.tw/t.pax:0;
  t.unit=t.pax>0?t.sub*1e6/(t.pax*1e3):0;
  t.unit10=t.pkm>0?t.sub*1e6/(t.pkm*1e6)*10:0;
  t.dist=t.pax>0?(t.pkm*1e3)/t.pax:0;
  t.cover=(t.tar+t.unit)>0?t.tar/(t.tar+t.unit)*100:0;
  t.parts=parts;return t;
}

const fPax=v=>v>=1e6?nf(v/1e6,2)+' млрд':v>=1000?nf(v/1000,1)+' млн':nf(v,0)+' тыс.';   // v в тыс. пасс.
const fRub=v=>v>=1000?nf(v/1000,2)+' млрд':nf(v,0)+' млн';                              // v в млн руб.
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(a,b)=>b>0?(a/b-1)*100:null;
const dlt=v=>v==null?'':`<div class="dlt ${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${nf(Math.abs(v),1)}%</div>`;

/* ---------- геометрия: разная для мобильного и настольного экрана ---------- */
const MOB=()=>(typeof window!=='undefined'&&window.innerWidth)?window.innerWidth<=760:false;
function geo(H){const m=MOB();return {m,
  W:m?440:900, H:m?Math.max(190,Math.round((H||290)*.80)):(H||290),
  fs:m?11.5:10.5, mr:m?16:18, mt:m?12:14, mb:m?34:40, ticks:m?4:5}}
/* компактный формат чисел для осей: 49,3 млн вместо 49 300 003 */
function fNum(v){const x=Math.abs(v);
  if(x>=1e6)return nf(v/1e6,x>=1e7?0:1)+' млн';

/* левое поле рассчитывается по самой длинной подписи оси, иначе она выходит за карточку */
function leftPad(max,fmt,fs,ticks){let w=0;

function lineChart(labels,series,fmt,H=290){

/* региональный разброс годовых темпов — детерминированный, воспроизводимый */
const mdr=(ri,y)=>1+(u(REGIONS[ri].n+'macro'+y)-0.5)*0.09;
function buildMNORM(){const o={};MYEARS.forEach(y=>{
  let ec=0,nnd=0,inc=0,oth=0;
  REGIONS.forEach((R,i)=>{const d=mdr(i,y);
    ec+=EC[i]*R.p*d;
    nnd+=Math.pow(EC[i],0.95)*R.p*d;
    inc+=R.p*(0.45+0.55*Math.pow(Math.min(EC[i],4),0.58))*Math.pow(R.ci,0.33);
    oth+=R.p*(1+0.55/Math.max(EC[i],0.25))});
  o[y]={ec,nnd,inc,oth}});return o}
let MNORM=buildMNORM();

let MACRO_OVR=null;                 // загруженные пользователем макро- и бюджетные данные
const mcache=new Map();
function macro(ri,y){
  const key=ri+'|'+y;
  if(MACRO_OVR&&MACRO_OVR.has(key))return MACRO_OVR.get(key);
  if(mcache.has(key))return mcache.get(key);
  const R=REGIONS[ri],N=MNORM[y],d=mdr(ri,y),e=EC[ri];
  const grp=MRF.grp[y]*(e*R.p*d)/N.ec;                                   // млрд руб.
  const nnd=MRF.nnd[y]*(Math.pow(e,0.95)*R.p*d)/N.nnd;                   // млрд руб.
  const dotv=(DOT25[R.n]||0)*(DOT_IDX[y]||1);                            // млрд руб.
  const dotAll=REGIONS.reduce((a,x)=>a+(DOT25[x.n]||0),0)*(DOT_IDX[y]||1);
  const othPool=Math.max(MRF.rev[y]-MRF.nnd[y]-dotAll,0);
  const oth=othPool*(R.p*(1+0.55/Math.max(e,0.25)))/N.oth;               // прочие безвозмездные
  const rev=nnd+dotv+oth;
  const exp=rev*(MRF.exp[y]/MRF.rev[y])*(0.96+0.08*u(R.n+'e'+y));
  const income=MRF.income[y]*(0.45+0.55*Math.pow(Math.min(e,4),0.58))*Math.pow(R.ci,0.33);
  const wage=MRF.wage[y]*(0.50+0.50*Math.pow(Math.min(e,4),0.55))*Math.pow(R.ci,0.38);
  const unemp=Math.max(0.8,MRF.unemp[y]*(1.55-0.55*Math.min(e,2.2))*(0.85+0.30*u(R.n+'un')));
  const inv=MRF.inv[y]*(e*R.p*d)/N.ec*(0.75+0.55*u(R.n+'inv'));
  const debtShare=dotv>0?(0.28+0.34*u(R.n+'dg')):(0.06+0.16*u(R.n+'dg'));
  const debt=nnd*debtShare;
  const t0408=exp*(0.038+0.030*Math.min(Math.max(R.ci-0.85,0),1.1)+0.012*u(R.n+'tr'));
  const o={grp,grpPc:grp/R.p,nnd,nndPc:nnd/R.p,dot:dotv,dotPc:dotv*1e9/(R.p*1e6),
    oth,rev,revPc:rev/R.p,exp,def:exp-rev,income,wage,unemp,inv,debt,
    debtN:nnd>0?debt/nnd*100:0,gratis:dotv+oth,
    gratisSh:rev>0?(dotv+oth)/rev*100:0,t0408,
    t0408Sh:exp>0?t0408/exp*100:0};
  mcache.set(key,o);return o;
}
/* нормировка среднедушевых доходов и зарплаты на федеральный якорь */
function buildMSCALE(){const o={};MYEARS.forEach(y=>{
  let wi=0,ww=0,p=0;REGIONS.forEach((R,i)=>{const m=macro(i,y);wi+=m.income*R.p;ww+=m.wage*R.p;p+=R.p});
  o[y]={income:MRF.income[y]/(wi/p),wage:MRF.wage[y]/(ww/p)}});return o}
let MSCALE=buildMSCALE();
const inc=(ri,y)=>macro(ri,y).income*MSCALE[y].income;
const wag=(ri,y)=>macro(ri,y).wage*MSCALE[y].wage;
/* реальная динамика: номинальный рост, очищенный от ИПЦ */
function realGrowth(ri,y,fn){const py=y-1;if(!MYEARS.includes(py))return null;
  const a=fn(ri,y),b=fn(ri,py);if(!(b>0))return null;
  return ((a/b)/(1+(MRF.cpi[y]||0)/100)-1)*100}

function macroAgg(regs,y){
  const t={grp:0,nnd:0,dot:0,oth:0,rev:0,exp:0,inv:0,debt:0,t0408:0,p:0,incw:0,wagw:0,unw:0};
  for(const ri of regs){const m=macro(ri,y),p=REGIONS[ri].p;
    t.grp+=m.grp;t.nnd+=m.nnd;t.dot+=m.dot;t.oth+=m.oth;t.rev+=m.rev;t.exp+=m.exp;
    t.inv+=m.inv;t.debt+=m.debt;t.t0408+=m.t0408;t.p+=p;
    t.incw+=inc(ri,y)*p;t.wagw+=wag(ri,y)*p;t.unw+=m.unemp*p}
  t.income=t.p>0?t.incw/t.p:0;t.wage=t.p>0?t.wagw/t.p:0;t.unemp=t.p>0?t.unw/t.p:0;
  t.grpPc=t.p>0?t.grp/t.p:0;t.revPc=t.p>0?t.rev/t.p:0;t.nndPc=t.p>0?t.nnd/t.p:0;
  t.dotPc=t.p>0?t.dot*1e9/(t.p*1e6):0;
  t.gratisSh=t.rev>0?(t.dot+t.oth)/t.rev*100:0;
  t.debtN=t.nnd>0?t.debt/t.nnd*100:0;
  t.t0408Sh=t.exp>0?t.t0408/t.exp*100:0;t.def=t.exp-t.rev;
  return t;
}
/* нагрузка пригородного железнодорожного комплекса на бюджет субъекта */
function railLoad(ri,y){
  const a=agg([ri],'rail',y,allMonths(y)),m=macro(ri,y);
  const regSub=a.reg/1000;                       // млн руб. -> млрд руб.
  return {sub:regSub,shRev:m.rev>0?regSub/m.rev*100:0,
    sh0408:m.t0408>0?regSub/m.t0408*100:0,
    perCap:REGIONS[ri].p>0?regSub*1e9/(REGIONS[ri].p*1e6):0,
    farePc:inc(ri,y)>0?a.tar/inc(ri,y)*100:0};
}

const ELREF=[

/* дуговая эластичность из данных дашборда: тариф приводится к ценам базового года */
function arcElast(ri,y){
  if(!MYEARS.includes(y-1))return null;
  const a=agg([ri],'rail',y,allMonths(y)),b=agg([ri],'rail',y-1,allMonths(y-1));
  if(!(a.pax>0&&b.pax>0&&a.tar>0&&b.tar>0))return null;
  const t1=a.tar/(1+(MRF.cpi[y]||0)/100),t0=b.tar;
  const dq=(a.pax-b.pax)/((a.pax+b.pax)/2),dp=(t1-t0)/((t1+t0)/2);
  return Math.abs(dp)<1e-4?null:dq/dp;
}
const elOf=ri=>(ELAST&&ELAST.has(ri))?ELAST.get(ri):(S.elVal!=null?S.elVal:null);
/* сценарий: изменение тарифа на dt % при постоянной эластичности */
function elScenario(ri,y,dt,e){
  const a=agg([ri],'rail',y,allMonths(y));
  if(!(a.pax>0)||e==null)return null;
  const dq=e*dt;                                   // % изменения пассажиропотока
  const pax1=a.pax*(1+dq/100),tar1=a.tar*(1+dt/100);
  const rev0=a.pax*a.tar/1000,rev1=pax1*tar1/1000; // млн руб.
  const cost=rev0+a.sub;                           // экономически обоснованные затраты, млн руб.
  const sub1=Math.max(cost-rev1,0);
  const ae=Math.abs(e);
  const dtOpt=ae>0?((1+ae)/(2*ae)-1)*100:null;     // линейная функция спроса: максимум выручки
  return {pax0:a.pax,pax1,dq,tar0:a.tar,tar1,rev0,rev1,dRev:rev0>0?(rev1/rev0-1)*100:0,
    sub0:a.sub,sub1,dSub:a.sub>0?(sub1/a.sub-1)*100:0,cover0:cost>0?rev0/cost*100:0,
    cover1:cost>0?rev1/cost*100:0,dtOpt};
}
/* горизонтальная диаграмма со знаком — для коэффициентов эластичности */
function hbar(items,fmt){
  const m=MOB(),W=m?440:900,fs=m?10.5:11,rh=m?21:23,ml=m?116:250,mr=m?46:60;
  const H=8+items.length*rh+8;
  let lim=0;items.forEach(i=>lim=Math.max(lim,Math.abs(i.v)));lim=niceMax(lim||1);
  const x0=ml+(W-ml-mr)*0.5,sc=v=>((W-ml-mr)*0.5)*(v/lim);
  const cut=t=>String(t).length>(m?15:34)?String(t).slice(0,(m?14:33))+'…':String(t);
  let g=`<line x1="${x0}" x2="${x0}" y1="4" y2="${H-4}" stroke="var(--line2)"/>`;
  items.forEach((it,i)=>{const y=8+i*rh,w=sc(it.v);
    g+=`<text x="${ml-8}" y="${y+rh*0.62}" fill="var(--mute)" font-size="${fs}" text-anchor="end" font-family="var(--body)">${esc(cut(it.n))}</text>`;
    g+=`<rect x="${w<0?x0+w:x0}" y="${y+3}" width="${Math.max(Math.abs(w),1)}" height="${rh-9}" fill="${it.c||'#C0392B'}" opacity=".85"><title>${esc(it.n)}: ${fmt(it.v)}</title></rect>`;
    g+=`<text x="${W-6}" y="${y+rh*0.62}" fill="var(--ink)" font-size="${fs}" text-anchor="end" font-family="var(--mono)">${fmt(it.v)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
/* точечная диаграмма со знаковыми осями */
function scatterS(pts,xl,yl,fx,fy){
  const m=MOB(),W=m?440:900,H=m?330:380,mr=m?18:20,mt=m?14:16,mb=m?46:50,fs=m?11:10.5,ticks=4;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const xlo=Math.min(0,...xs),xhi=Math.max(0,...xs),ylo=Math.min(0,...ys),yhi=Math.max(0,...ys);
  const px=(xhi-xlo)*0.08||1,py=(yhi-ylo)*0.08||1;
  const XL=xlo-px,XH=xhi+px,YL=ylo-py,YH=yhi+py;
  const ml=Math.round(Math.max(38,String(fy(YH)).length*fs*0.62+12));
  const X=v=>ml+(W-ml-mr)*((v-XL)/(XH-XL)),Y=v=>H-mb-(H-mb-mt)*((v-YL)/(YH-YL));
  let g='';
  for(let i=0;i<=ticks;i++){const v=YL+(YH-YL)*i/ticks,y=Y(v);
    g+=`<line x1="${ml}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/>
    <text x="${ml-6}" y="${y+fs*0.36}" fill="var(--mute)" font-size="${fs}" text-anchor="end" font-family="var(--mono)">${fy(v)}</text>`}
  for(let i=0;i<=ticks;i++){const v=XL+(XH-XL)*i/ticks;
    g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${H-mb}" stroke="var(--line)"/>
    <text x="${X(v)}" y="${H-mb+fs+3}" fill="var(--mute)" font-size="${fs}" text-anchor="${i===0?'start':i===ticks?'end':'middle'}" font-family="var(--mono)">${fx(v)}</text>`}
  if(XL<0&&XH>0)g+=`<line x1="${X(0)}" x2="${X(0)}" y1="${mt}" y2="${H-mb}" stroke="var(--line2)"/>`;
  if(YL<0&&YH>0)g+=`<line x1="${ml}" x2="${W-4}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line2)"/>`;
  /* линия регрессии — наклон и есть средняя эластичность по выборке */
  const n=pts.length,sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0),sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const den=n*sxx-sx*sx;
  if(Math.abs(den)>1e-9){const b=(n*sxy-sx*sy)/den,a0=(sy-b*sx)/n;
    g+=`<line x1="${X(XL)}" y1="${Y(a0+b*XL)}" x2="${X(XH)}" y2="${Y(a0+b*XH)}" stroke="#C77A0A" stroke-width="1.8" stroke-dasharray="6 4" opacity=".85"><title>Линейная аппроксимация, наклон ${nf(b,3)}</title></line>`}
  pts.forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${(p.r||4.2)*(m?1.15:1)}" fill="${p.c||'#C0392B'}" opacity=".70" stroke="#FFFFFF"><title>${esc(p.n)}
${xl}: ${fx(p.x)}
${yl}: ${fy(p.y)}</title></circle>`});
  g+=`<text x="${W-mr}" y="${H-6}" fill="var(--mute)" font-size="${fs}" text-anchor="end" font-family="var(--display)">${esc(xl)} →</text>`;
  g+=`<text x="${ml-6}" y="${H-6}" fill="var(--mute)" font-size="${fs}" text-anchor="start" font-family="var(--display)">↑ ${esc(yl)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

P.unit=()=>{
  const ids=modeIds(),ms=allMonths(S.year),base=S.unitBase;
  const rows=REGIONS.map((r,i)=>{const a=aggMulti([i],ids,S.year,ms);
    return {i,n:r.n,d:r.d,pax:a.pax,park:a.park,sub:a.sub,fed:a.fed,tar:a.tar,unit:a.unit,unit10:a.unit10,cover:a.cover,dist:a.dist}});
  const key=base==='pax'?'unit':'unit10';
  const rk=[...rows].filter(r=>r[key]>0).sort((a,b)=>b[key]-a[key]).map(r=>({n:r.n,v:r[key],hl:S.reg===String(r.i)}));
  const cols=[['n','Субъект РФ'],['d','ФО'],['pax','Пассажиры, тыс.'],['dist','Дальность, км'],['sub','Поддержка, млн ₽'],
    ['tar','Тариф, ₽'],['unit','Руб./пасс.'],['unit10','Руб./10 п.-км'],['cover','Покрытие, %']];
  const sorted=[...rows].sort((a,b)=>{const k=S.sort.k,x=a[k],y=b[k];
    return (typeof x==='string'?x.localeCompare(y,'ru'):x-y)*S.sort.dir});
  const tot=rows.reduce((a,r)=>({pax:a.pax+r.pax,sub:a.sub+r.sub}),{pax:0,sub:0});
  const med=(()=>{const v=rk.map(x=>x.v).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:0})();

    переключатель «на 10 пасс.-км» — он снимает эффект географии. Медиана по выбранной базе: <b>${nf(med,base==='pax'?1:2)} руб.</b></div>`
  +filters({gran:false})
  +`<div class="bar"><div class="fld"><span>База сравнения</span><div class="seg" id="fBase">
    <button data-b="pax" aria-pressed="${base==='pax'}">Руб. на 1 пассажира</button>

P.matrix=()=>{
  const ids=modeIds(),ms=allMonths(S.year);
  const pts=REGIONS.map((r,i)=>{const a=aggMulti([i],ids,S.year,ms);
    return {n:r.n+' ('+r.d+')',x:a.tar,y:a.unit,r:Math.max(3,Math.sqrt(a.pax/900)),c:M[ids[0]]?.c||'#1B7BA6',d:r.d}}).filter(p=>p.y>0);
  const byD=DISTRICTS.map(d=>{const rs=REGIONS.map((r,i)=>[r,i]).filter(x=>x[0].d===d).map(x=>x[1]);
    const a=aggMulti(rs,ids,S.year,ms);return {d,a,n:rs.length}});
  const COLD=['#C77A0A','#C0392B','#1B7BA6','#64798C','#7A5BA6','#17784A','#A8497B','#0E7C7B'];
  const pts2=pts.map(p=>({...p,c:COLD[DISTRICTS.indexOf(p.d)%COLD.length]}));
  const totPax=byD.reduce((a,x)=>a+x.a.pax,0),totSub=byD.reduce((a,x)=>a+x.a.sub,0);
  return head('Матрица регионов',`Позиционирование субъектов РФ в координатах «тариф — бюджетная поддержка на пассажира», ${S.year} год. Размер точки пропорционален объёму отправленных пассажиров.`)
  +filters({gran:false,reg:false})
  +`<div class="grid">

      <p class="note">Пунктир — средние значения по выборке. Квадранты: справа-внизу — высокий тариф при низкой поддержке; слева-вверху — низкий тариф при высокой дотационности</p>
      ${scatter(pts2,'Средний тариф, руб. за поездку','Поддержка, руб. на 1 пассажира',v=>nf(v,0),v=>nf(v,0))}
      <div class="legend">${DISTRICTS.map((d,i)=>`<span><i style="background:${COLD[i%COLD.length]};border-radius:50%;width:9px;height:9px"></i>${d}</span>`).join('')}</div></div>

        <th class="nos">Руб./10 п.-км</th><th class="nos">Тариф, ₽</th><th class="nos">Покрытие, %</th></tr></thead><tbody>
        ${byD.sort((a,b)=>b.a.pax-a.a.pax).map(x=>`<tr><td>${esc(x.d)}</td><td class="num">${x.n}</td>
          <td class="num">${nf(x.a.pax/1000,1)}</td><td class="num">${nf(totPax>0?x.a.pax/totPax*100:0,1)}%</td>
          <td class="num">${nf(x.a.sub,0)}</td><td class="num">${nf(totSub>0?x.a.sub/totSub*100:0,1)}%</td>
          <td class="num" style="color:var(--amber)">${nf(x.a.unit,1)}</td><td class="num">${nf(x.a.unit10,2)}</td>
          <td class="num">${nf(x.a.tar,1)}</td><td class="num">${nf(x.a.cover,1)}</td></tr>`).join('')}</tbody></table></div></div>
  </div>`};

P.compare=()=>{

  const metrics=[['pax','Отправлено пассажиров, тыс.',v=>nf(v,0)],['pkm','Пассажирооборот, млн пасс.-км',v=>nf(v,0)],
    ['dist','Средняя дальность, км',v=>nf(v,1)],['park','Парк ТС, ед.',v=>nf(v)],

  +`<div class="bar">${sel.map((v,j)=>`<label class="fld"><span>Субъект ${j+1}</span>
    <select class="fCmp" data-j="${j}">${DISTRICTS.map(d=>`<optgroup label="${d}">${REGIONS.map((r,k)=>[r,k])
      .filter(x=>x[0].d===d).map(([r,k])=>`<option value="${k}"${k===v?' selected':''}>${r.n}</option>`).join('')}</optgroup>`).join('')}</select></label>`).join('')}

        `<th class="nos" style="text-align:right;color:${COL[j]}">${esc(d.R.n)}</th>`).join('')}</tr></thead><tbody>
        ${metrics.map(m=>{const vals=data.map(d=>d.a[m[0]]);const mx=Math.max(...vals);
          return `<tr><td class="w" style="text-align:left">${m[1]}</td>${vals.map(v=>
          `<td class="num"${v===mx&&['pax','pkm','park','cover'].includes(m[0])?' style="color:var(--amber)"':''}>${m[2](v)}</td>`).join('')}</tr>`}).join('')}

    ${legend(data.map((d,j)=>({name:d.R.n,color:COL[j]})))}
    ${lineChart(MN.slice(0,LASTM[S.year]),data.map((d,j)=>({name:d.R.n,color:COL[j],

const TKIND={zone:'зонный',zones:'зонный дифференцированный',km:'фиксированная плата + километровый',perKm:'километровый',fixed:'фиксированный'};
/* стоимость поездки заданной дальности по тарифной конструкции */
function tarAt(t,km){
  if(!t)return null;
  if(t.k==='fixed')return t.v;
  if(t.k==='perKm')return t.perKm*km;
  if(t.k==='km')return t.base+Math.max(0,km-t.baseKm)*t.perKm;
  if(t.k==='zone'){const n=Math.max(1,Math.ceil(km/t.zoneKm));return t.first+(n-1)*t.next}
  if(t.k==='zones'){const n=Math.max(1,Math.ceil(km/t.zoneKm));let v=0;
    for(let i=0;i<n;i++)v+=t.z[Math.min(i,t.z.length-1)];return v}
  return null}

P['rail-subsidy']=()=>{
  const y=S.year,ms=allMonths(y);
  const rows=REGIONS.map((r,i)=>{const a=agg([i],'rail',y,ms);
    const all=aggMulti([i],MODES.filter(m=>m.id!=='priv').map(m=>m.id),y,ms);
    return {i,n:r.n,d:r.d,ppk:REG_PPK[i].map(p=>p.s).join(', ')||'—',pax:a.pax,reg:a.reg,fed:a.fed,sub:a.sub,
      unit:a.unit,unit10:a.unit10,tar:a.tar,cover:(a.tar+a.unit)>0?a.tar/(a.tar+a.unit)*100:0,
      perCap:r.p>0?a.reg/r.p:0,share:all.pax>0?a.pax/all.pax*100:0}}).filter(x=>x.pax>0);
  const key=S.unitBase==='pax'?'reg':'perCap';
  const rk=[...rows].sort((a,b)=>b[key]-a[key]).map(r=>({n:r.n,v:r[key],hl:S.reg===String(r.i)}));
  const tot=rows.reduce((a,r)=>({pax:a.pax+r.pax,reg:a.reg+r.reg,fed:a.fed+r.fed}),{pax:0,reg:0,fed:0});
  const dyn=[{name:'Федеральный бюджет',color:'#1B7BA6',values:YEARS.map(yy=>agg(REGIONS.map((_,i)=>i),'rail',yy,allMonths(yy)).fed)},
             {name:'Бюджеты субъектов',color:'#C77A0A',values:YEARS.map(yy=>agg(REGIONS.map((_,i)=>i),'rail',yy,allMonths(yy)).reg)}];
  const cols=[['n','Субъект РФ'],['ppk','Перевозчик'],['pax','Пассажиры, тыс.'],['reg','Субсидии субъекта, млн ₽'],
    ['fed','Федеральные, млн ₽'],['unit','Руб./пасс.'],['unit10','Руб./10 п.-км'],['perCap','Млн ₽ на 1 млн жителей'],
    ['tar','Тариф, ₽'],['cover','Покрытие, %'],['share','Доля ЖД, %']];
  const sorted=[...rows].sort((a,b)=>{const k=S.sort.k in rows[0]?S.sort.k:'reg',x=a[k],y2=b[k];
    return (typeof x==='string'?x.localeCompare(y2,'ru'):x-y2)*S.sort.dir});
  return head('Железнодорожный пригород: субсидии субъектов',`Сколько каждый субъект РФ платит за пригородное железнодорожное сообщение и как это соотносится с федеральной поддержкой, ${y} год.`)
  +`<div class="callout"><b>Два разных источника с разной природой.</b> Федеральный бюджет через ОАО «РЖД» компенсирует скидку 99 % на услуги
    инфраструктуры — она пропорциональна объёму работы в пассажиро-километрах и продлена до 2030 года. Субъект компенсирует выпадающие доходы,
    возникшие из-за установления тарифа ниже экономически обоснованного уровня, — это решение самого субъекта, и именно здесь возникает
    разброс между регионами. В модели эти два потока распределяются по разным базам: федеральный — по пассажиро-километрам, региональный — по объёму и уровню затрат.</div>`
  +`<div class="bar"><label class="fld"><span>Год</span><select id="fYear">${YEARS.map(v=>`<option value="${v}"${v===y?' selected':''}>${v}</option>`).join('')}</select></label>

      <button data-b="pax" aria-pressed="${S.unitBase==='pax'}">Объём субсидий субъекта</button>
      <button data-b="pkm" aria-pressed="${S.unitBase!=='pax'}">На 1 млн жителей</button></div></div></div>`

  +`<div class="grid g32">
    <div class="card"><h3>Рейтинг субъектов</h3><p class="note">${S.unitBase==='pax'?'Объём субсидий из бюджета субъекта на пригородное ж/д сообщение, млн руб.':'Субсидии субъекта в расчёте на 1 млн жителей, млн руб.'}</p>
      ${routeList(rk,v=>nf(v,1))}</div>
    <div class="card"><h3>Динамика по источникам, Российская Федерация</h3><p class="note">Млрд руб. — федеральный бюджет и бюджеты субъектов</p>
      ${legend(dyn)}${colChart(YEARS.map(yy=>String(yy)+(LASTM[yy]<12?'*':'')),dyn.map(d=>({...d,values:d.values})),fRub,true,260)}
      <dl class="kv" style="margin-top:12px">
        <dt>Федеральные субсидии, ${y}</dt><dd>${fRub(tot.fed)} руб.${y===2025?' <span class="q f">Ф</span>':''}</dd>
        <dt>Субсидии субъектов, ${y}</dt><dd>${fRub(tot.reg)} руб. <span class="q o">О</span></dd>
        <dt>Доля субъектов в поддержке</dt><dd>${nf((tot.reg+tot.fed)>0?tot.reg/(tot.reg+tot.fed)*100:0,1)}%</dd>
        <dt>Всего на 1 пассажира</dt><dd>${nf(tot.pax>0?(tot.reg+tot.fed)*1e6/(tot.pax*1e3):0,1)} руб.</dd>
      </dl>
      <div class="note-in">Ряд субсидий субъектов — оценка. Проверяемый ориентир: в 2015 году гарантированный субъектами объём компенсации
        вырос с 7,5 до 10,2 млрд руб. Актуальные значения собираются из законов о бюджете и отчётов об исполнении по каждому субъекту.</div></div>
  </div>
  <div class="grid" style="margin-top:16px"><div class="card"><h3>Субсидии по субъектам</h3>
    <p class="note">${y} год · только субъекты с пригородным железнодорожным сообщением · сортировка щелчком по заголовку</p>
    <div class="scrollhint">↔ таблица прокручивается по горизонтали</div><div class="tw"><table><thead><tr>${cols.map(c=>`<th data-k="${c[0]}">${c[1]}${S.sort.k===c[0]?(S.sort.dir<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>

  +`<div class="grid g2">

        <li><b>Разбивка по субъектам.</b> Федеральный итог раскладывается пропорционально населению и индексу относительного уровня экономического развития субъекта; сумма по субъектам за каждый год равна федеральному якорю. Индекс развития — экспертная калибровка порядка величин, а не измеренное значение.</li>
        <li><b>Уровень расчётной бюджетной обеспеченности</b> не моделируется. Он публикуется Минфином России в приложениях к методике распределения дотаций и подставляется загрузкой; из объёма дотации он однозначно не восстанавливается, поскольку зависит от индекса бюджетных расходов.</li>
        <li><b>Реальная динамика.</b> Номинальные ряды дефлируются накопленным индексом потребительских цен с базой 2021 года. Реальный тариф считается так же, что делает сопоставимыми линии доходов и тарифа на одном графике.</li>
      </ul>
      <h3 style="margin-top:18px">Эластичность спроса по цене</h3>
      <ul class="tight">
        <li><b>Дашборд не рассчитывает эластичность.</b> Коэффициент задаётся пользователем — единым значением либо загрузкой по субъектам, и применяется к сценарию изменения тарифа.</li>
        <li><b>Сценарий.</b> Изменение пассажиропотока принимается равным произведению коэффициента на процентное изменение тарифа. Выручка пересчитывается как произведение нового тарифа на новый пассажиропоток; затраты перевозчика приняты неизменными, поэтому изменение потребности в поддержке равно изменению выручки с обратным знаком.</li>
        <li><b>Тариф максимума выручки</b> рассчитан для линейной функции спроса, откалиброванной по текущей точке и заданному коэффициенту: прирост тарифа составляет (1 + |E|) / (2 · |E|) − 1. При постоянной эластичности с |E| &lt; 1 выручка растёт с тарифом монотонно и максимума не имеет — на это стоит обращать внимание при защите тарифного решения.</li>
        <li><b>Дуговая оценка</b> считается по формуле средней точки: отношение относительного изменения пассажиропотока к относительному изменению тарифа, приведённого к ценам предыдущего года. Пока в дашборд не загружены фактические ряды, она отражает соотношения модели, а не поведение спроса.</li>
      </ul>
      <div class="note-in" style="margin-top:12px">Номера форм статистического наблюдения приведены только там, где они подтверждены:
        № 65-автотранс и № 1-автотранс по автомобильному транспорту, № 1-река и № 53-ВТ по внутреннему водному.
        По железнодорожному пригородному сообщению первичным источником является отчётность ОАО «РЖД» и пригородных пассажирских компаний —
        конкретную форму следует уточнить по действующему альбому форм, а не воспроизводить по памяти.</div></div>
  </div>`;

/* =====================================================================
   8А. СТРАНИЦЫ: МАКРОЭКОНОМИКА, БЮДЖЕТНАЯ ОБЕСПЕЧЕННОСТЬ, ЭЛАСТИЧНОСТЬ
   ===================================================================== */
const mRegs=()=>S.mreg==='RF'?RAILREGS:S.mreg.startsWith('D:')
  ?RAILREGS.filter(i=>REGIONS[i].d===S.mreg.slice(2)):[+S.mreg];
const mLabel=()=>S.mreg==='RF'?'все субъекты с пригородным железнодорожным сообщением'
  :S.mreg.startsWith('D:')?S.mreg.slice(2):REGIONS[+S.mreg].n;
const CPICUM=(()=>{const o={};let c=1;MYEARS.forEach((y,i)=>{if(i>0)c*=1+(MRF.cpi[y]||0)/100;o[y]=c});return o})();
let MDIST=[...new Set(RAILREGS.map(i=>REGIONS[i].d))];

function mBar(extra,csvId){
  const byD={};RAILREGS.forEach(i=>{(byD[REGIONS[i].d]=byD[REGIONS[i].d]||[]).push([i,REGIONS[i].n])});
  return `<div class="bar">
  <label class="fld"><span>Год</span><select id="fMYear">${MYEARS.map(v=>`<option value="${v}"${v===S.myear?' selected':''}>${v}</option>`).join('')}</select></label>
  <label class="fld"><span>Территория</span><select id="fMReg">
    <option value="RF"${S.mreg==='RF'?' selected':''}>Все субъекты с пригородным ж/д сообщением</option>
    <optgroup label="Федеральные округа">${MDIST.map(d=>`<option value="D:${d}"${S.mreg==='D:'+d?' selected':''}>${d} — округ целиком</option>`).join('')}</optgroup>
    ${Object.entries(byD).map(([d,l])=>`<optgroup label="${d}">${l.map(([i,n])=>`<option value="${i}"${S.mreg===String(i)?' selected':''}>${esc(n)}</option>`).join('')}</optgroup>`).join('')}
  </select></label>${extra||''}<div style="flex:1"></div>
  ${csvId===false?'':`<div class="fld"><span>&nbsp;</span><button class="ghost" id="btnMacroCsv">Выгрузить CSV</button></div>`}</div>`}

const msort=(rows,def)=>{const k=(S.msort&&S.msort.k)||def,d=(S.msort&&S.msort.dir)||-1;
  return rows.slice().sort((a,b)=>{const x=a[k],y=b[k];
    if(typeof x==='string'||typeof y==='string')return d*String(x).localeCompare(String(y),'ru');
    return d*((x==null?-Infinity:x)-(y==null?-Infinity:y))})};
const mth=(k,t,cur)=>`<th data-mk="${k}"${cur===k?' style="color:var(--ink)"':''}>${t}</th>`;

/* ------------------------------ МАКРОЭКОНОМИКА ------------------------------ */
P.macro=()=>{
  const y=S.myear,regs=mRegs(),t=macroAgg(regs,y);
  const py=y-1,tp=MYEARS.includes(py)?macroAgg(regs,py):null;
  const rail=agg(regs,'rail',y,allMonths(y));
  const trips=t.p>0?rail.pax*1000/(t.p*1e6):0;
  const faresh=t.income>0?rail.tar/t.income*100:0;
  const realInc=tp?((t.income/tp.income)/(1+(MRF.cpi[y]||0)/100)-1)*100:null;
  const K=[
   ['Валовой региональный продукт',nf(t.grp/1000,1),'трлн руб.'+mBadge('grp',y),tp?pct(t.grp,tp.grp):null],
   ['ВРП на душу населения',nf(t.grpPc,0),'тыс. руб./чел.'+mBadge('grp',y),tp?pct(t.grpPc,tp.grpPc):null],
   ['Среднедушевые денежные доходы',nf(t.income,0),'руб./мес'+mBadge('income',y),tp?pct(t.income,tp.income):null],
   ['Реальные доходы населения',(realInc==null?'—':(realInc>=0?'+':'')+nf(realInc,1)),'% к предыдущему году'+mBadge('rdi',y),null],
   ['Среднемесячная заработная плата',nf(t.wage,0),'руб.'+mBadge('wage',y),tp?pct(t.wage,tp.wage):null],
   ['Уровень безработицы',nf(t.unemp,1),'% рабочей силы'+mBadge('unemp',y),null],
   ['Инфляция (ИПЦ), декабрь к декабрю',nf(MRF.cpi[y]||0,2),'%'+mBadge('cpi',y),null],
   ['Инвестиции в основной капитал',nf(t.inv/1000,2),'трлн руб.'+mBadge('inv',y),tp?pct(t.inv,tp.inv):null],
   ['Поездок пригородным ж/д на жителя',nf(trips,1),'поездок в год',null],
   ['Средний тариф к доходу',nf(faresh,3),'% среднедушевого дохода за поездку',null]
  ];
  /* ряды за 5 лет */
  const L=MYEARS.map(String);
  const sGrp=[{name:'ВРП, трлн руб.',color:'#1B7BA6',values:MYEARS.map(yy=>macroAgg(regs,yy).grp/1000)},
              {name:'Инвестиции в основной капитал, трлн руб.',color:'#C77A0A',values:MYEARS.map(yy=>macroAgg(regs,yy).inv/1000)}];
  const sInc=[{name:'Среднедушевые доходы, руб./мес',color:'#17784A',values:MYEARS.map(yy=>macroAgg(regs,yy).income)},
              {name:'Среднемесячная заработная плата, руб.',color:'#7A5BA6',values:MYEARS.map(yy=>macroAgg(regs,yy).wage)}];
  const b0=macroAgg(regs,2021),r0=agg(regs,'rail',2021,allMonths(2021));
  const real=k=>MYEARS.map(yy=>{const c=CPICUM[yy];
    if(k==='inc')return macroAgg(regs,yy).income/b0.income/c*100;
    if(k==='wag')return macroAgg(regs,yy).wage/b0.wage/c*100;
    if(k==='rev')return macroAgg(regs,yy).rev/b0.rev/c*100;
    const t2=agg(regs,'rail',yy,allMonths(yy));return r0.tar>0?t2.tar/r0.tar/c*100:0});
  const sReal=[{name:'Реальные доходы населения',color:'#17784A',values:real('inc')},
               {name:'Реальная заработная плата',color:'#7A5BA6',values:real('wag')},
               {name:'Реальный тариф пригородного ж/д',color:'#C0392B',values:real('tar')},
               {name:'Реальные доходы бюджета субъекта',color:'#1B7BA6',values:real('rev')}];
  /* тепловая карта: ВРП на душу по округам */
  const hmRows=MDIST,hmVals=MDIST.map(d=>{const rr=RAILREGS.filter(i=>REGIONS[i].d===d);
    return MYEARS.map(yy=>macroAgg(rr,yy).grpPc)});
  /* связь экономики субъекта и пользования пригородом */
  const pts=RAILREGS.map(i=>{const m=macro(i,y),a=agg([i],'rail',y,allMonths(y));
    return {n:REGIONS[i].n,x:m.grpPc,y:REGIONS[i].p>0?a.pax*1000/(REGIONS[i].p*1e6):0,
      r:3+Math.min(Math.sqrt(REGIONS[i].p)*1.7,9),c:M.rail.c}}).filter(p=>p.x>0&&p.y>0);
  /* таблица по субъектам */
  const cur=(S.msort&&S.msort.k)||'grpPc';
  const rows=msort(RAILREGS.map(i=>{const m=macro(i,y),a=agg([i],'rail',y,allMonths(y)),R=REGIONS[i];
    return {i,n:R.n,d:R.d,grp:m.grp,grpPc:m.grpPc,income:inc(i,y),wage:wag(i,y),unemp:m.unemp,inv:m.inv,
      trips:R.p>0?a.pax*1000/(R.p*1e6):0,fare:inc(i,y)>0?a.tar/inc(i,y)*100:0}}),'grpPc');
  return head('Макроэкономика субъектов',
    `Ключевые макроэкономические показатели за ${MYEARS[0]}—${MYEARS[MYEARS.length-1]} годы по ${RAILREGS.length} субъектам, где организовано пригородное железнодорожное сообщение. Выборка: ${esc(mLabel())}.`)
  +`<div class="callout"><b>Область охвата.</b> Из 85 субъектов справочника исключены ${NORAIL.length} субъекта без пригородного железнодорожного сообщения: ${NORAIL.map(esc).join(', ')}.
   Федеральные значения инфляции, безработицы, реальных доходов и реальной заработной платы за 2023—2025 гг. привязаны к официальной статистике (метка Ф).
   Разбивка по субъектам — модельная (метка О): она воспроизводит порядок величин и соотношения между регионами, но не заменяет данные Росстата.
   Подстановка фактических значений — на странице «Данные и загрузка», раздел макроэкономики.</div>`
  +mBar()
  +`<div class="tablo">${K.map(x=>`<div class="cell"><div class="lab">${x[0]}</div><div class="val">${x[1]}</div>
    <div class="unit">${x[2]}</div>${dlt(x[3])}</div>`).join('')}</div>
  <div class="grid g2">
    <div class="card"><h3>Валовой продукт и инвестиции</h3><p class="note">Текущие цены, ${esc(mLabel())}</p>
      ${legend(sGrp)}${lineChart(L,sGrp,v=>nf(v,1))}</div>
    <div class="card"><h3>Доходы населения и заработная плата</h3><p class="note">Номинальные значения, руб. в месяц</p>
      ${legend(sInc)}${lineChart(L,sInc,v=>fNum(v))}</div>
  </div>
  <div class="grid g32" style="margin-top:16px">
    <div class="card"><h3>Реальная динамика к 2021 году</h3>
      <p class="note">Номинальные ряды, дефлированные накопленным ИПЦ; 2021 год = 100. Расхождение линии тарифа с линией доходов показывает, растёт или снижается тарифная нагрузка на пассажира в реальном выражении</p>
      ${legend(sReal)}${lineChart(L,sReal,v=>nf(v,0))}</div>
    <div class="card"><h3>ВРП на душу населения по федеральным округам</h3>
      <p class="note">Тыс. руб. на человека, только субъекты с пригородным ж/д сообщением</p>
      ${heatmap(hmRows,MYEARS.map(String),hmVals,v=>nf(v/1000,0)+' млн')}</div>
  </div>
  <div class="grid" style="margin-top:16px"><div class="card">
    <h3>Экономический уровень субъекта и пользование пригородным железнодорожным транспортом</h3>
    <p class="note">Каждая точка — субъект, ${y} год; размер точки пропорционален численности населения. Пунктир — средние значения по выборке</p>
    ${scatter(pts,'ВРП на душу населения, тыс. руб.','Поездок пригородным ж/д на жителя',v=>nf(v,0),v=>nf(v,1))}</div></div>
  <div class="grid" style="margin-top:16px"><div class="card">
    <h3>Показатели по субъектам, ${y} год</h3><p class="note">Сортировка — по заголовку столбца</p>
    <p class="scrollhint">Таблица прокручивается по горизонтали →</p>
    <div class="tw"><table><thead><tr>
      ${mth('n','Субъект',cur)}${mth('d','ФО',cur)}${mth('grp','ВРП, млрд руб.',cur)}${mth('grpPc','ВРП на душу, тыс. руб.',cur)}
      ${mth('income','Доходы, руб./мес',cur)}${mth('wage','Зарплата, руб.',cur)}${mth('unemp','Безработица, %',cur)}
      ${mth('inv','Инвестиции, млрд руб.',cur)}${mth('trips','Поездок на жителя',cur)}${mth('fare','Тариф к доходу, %',cur)}
    </tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.n)}</td><td style="text-align:left;color:var(--mute)">${esc(r.d)}</td>
      <td class="num">${nf(r.grp,0)}</td><td class="num" style="color:var(--amber)">${nf(r.grpPc,0)}</td>
      <td class="num">${nf(r.income,0)}</td><td class="num">${nf(r.wage,0)}</td><td class="num">${nf(r.unemp,1)}</td>
      <td class="num">${nf(r.inv,0)}</td><td class="num">${nf(r.trips,1)}</td><td class="num">${nf(r.fare,3)}</td></tr>`).join('')}
    </tbody></table></div></div></div>`};

/* --------------------------- БЮДЖЕТНАЯ ОБЕСПЕЧЕННОСТЬ --------------------------- */
P['budget-cap']=()=>{
  const y=S.myear,regs=mRegs(),t=macroAgg(regs,y);
  const py=y-1,tp=MYEARS.includes(py)?macroAgg(regs,py):null;
  const rl=regs.reduce((a,i)=>{const l=railLoad(i,y);return{sub:a.sub+l.sub}},{sub:0});
  const shRail=t.rev>0?rl.sub/t.rev*100:0, sh0408=t.t0408>0?rl.sub/t.t0408*100:0;
  const donors=regs.filter(i=>!(DOT25[REGIONS[i].n]>0)).length;
  const K=[
   ['Доходы консолидированного бюджета',nf(t.rev/1000,2),'трлн руб.'+mBadge('rev',y),tp?pct(t.rev,tp.rev):null],
   ['Доходы на душу населения',nf(t.revPc,1),'тыс. руб./чел.'+mBadge('rev',y),tp?pct(t.revPc,tp.revPc):null],
   ['Налоговые и неналоговые доходы на душу',nf(t.nndPc,1),'тыс. руб./чел.'+mBadge('nnd',y),null],
   ['Дотация на выравнивание',nf(t.dot,1),'млрд руб.'+(y===2025?'<span class="q f" title="факт официального источника">Ф</span>':'<span class="q o" title="оценка / модельное значение">О</span>'),tp?pct(t.dot,tp.dot):null],
   ['Доля безвозмездных поступлений',nf(t.gratisSh,1)+'%','в доходах бюджета',null],
   ['Дефицит (−) / профицит (+)',(t.def>0?'−':'+')+nf(Math.abs(t.def),0),'млрд руб.'+mBadge('exp',y),null],
   ['Государственный долг к налоговым доходам',nf(t.debtN,1)+'%','долговая нагрузка',null],
   ['Расходы по подразделу 0408 «Транспорт»',nf(t.t0408,0),'млрд руб., '+nf(t.t0408Sh,1)+'% расходов',null],
   ['Субсидия пригородному ж/д из бюджета субъекта',nf(rl.sub,1),'млрд руб.',null],
   ['Доля пригородного ж/д в доходах бюджета',nf(shRail,3)+'%',nf(sh0408,1)+'% расходов по разделу «Транспорт»',null],
   ['Регионов без дотации на выравнивание',nf(donors,0),'из '+regs.length+' в выборке',null]
  ];
  const L=MYEARS.map(String);
  const sStruct=[
   {name:'Налоговые и неналоговые доходы',color:'#17784A',values:MYEARS.map(yy=>macroAgg(regs,yy).nnd)},
   {name:'Дотация на выравнивание',color:'#C77A0A',values:MYEARS.map(yy=>macroAgg(regs,yy).dot)},
   {name:'Прочие безвозмездные поступления',color:'#64798C',values:MYEARS.map(yy=>macroAgg(regs,yy).oth)}];
  const sLoad=[
   {name:'Доля безвозмездных поступлений в доходах, %',color:'#C77A0A',values:MYEARS.map(yy=>macroAgg(regs,yy).gratisSh)},
   {name:'Государственный долг к налоговым доходам, %',color:'#C0392B',values:MYEARS.map(yy=>macroAgg(regs,yy).debtN)},
   {name:'Расходы по подразделу 0408 в расходах бюджета, %',color:'#1B7BA6',values:MYEARS.map(yy=>macroAgg(regs,yy).t0408Sh)}];
  const top=RAILREGS.map(i=>({n:REGIONS[i].n,v:macro(i,y).dotPc/1000})).filter(x=>x.v>0)
    .sort((a,b)=>b.v-a.v).slice(0,18);
  const pts=RAILREGS.map(i=>{const m=macro(i,y),l=railLoad(i,y);
    return {n:REGIONS[i].n,x:m.gratisSh,y:l.perCap,r:3+Math.min(Math.sqrt(REGIONS[i].p)*1.7,9),c:'#C77A0A'}})
    .filter(p=>p.x>0&&p.y>0);
  const cur=(S.msort&&S.msort.k)||'dotPc';
  const rows=msort(RAILREGS.map(i=>{const m=macro(i,y),l=railLoad(i,y),R=REGIONS[i];
    return {i,n:R.n,d:R.d,dot:m.dot,dotPc:m.dotPc,rev:m.rev,revPc:m.revPc,nndPc:m.nndPc,
      gr:m.gratisSh,debtN:m.debtN,t0408:m.t0408,sub:l.sub,shRev:l.shRev,
      st:(DOT25[R.n]>0)?'получатель':'без дотации'}}),'dotPc');
  return head('Бюджетная обеспеченность субъектов',
    `Финансовая база субъектов, на которую опирается региональная часть поддержки пригородного сообщения. Ряды за ${MYEARS[0]}—${MYEARS[MYEARS.length-1]} годы, выборка: ${esc(mLabel())}.`)
  +`<div class="callout"><b>Что здесь факт.</b> Распределение дотаций на выравнивание бюджетной обеспеченности на 2025 год приведено по официальному распределению (метка Ф);
   субъекты, отсутствующие в распределении, показаны как не получающие эту дотацию — это тоже фактическая информация.
   Федеральные итоги доходов и расходов консолидированных бюджетов субъектов за 2025 год привязаны к отчёту об исполнении.
   Разбивка по субъектам доходов, налоговой базы, долга и расходов по подразделу 0408 — модельная (метка О).

P.elasticity=()=>{
  const y=S.myear,regs=mRegs(),dt=S.eldt;
  const eSel=ri=>{if(S.elsrc==='arc'){const v=arcElast(ri,y);return v==null?null:v}
    return (ELAST&&ELAST.has(ri))?ELAST.get(ri):S.elVal};
  /* агрегированный сценарий по выборке */
  const parts=regs.map(i=>({i,e:eSel(i),s:elScenario(i,y,dt,eSel(i))})).filter(x=>x.s);
  const A=parts.reduce((a,x)=>({pax0:a.pax0+x.s.pax0,pax1:a.pax1+x.s.pax1,rev0:a.rev0+x.s.rev0,
    rev1:a.rev1+x.s.rev1,sub0:a.sub0+x.s.sub0,sub1:a.sub1+x.s.sub1,ew:a.ew+x.e*x.s.pax0}),
    {pax0:0,pax1:0,rev0:0,rev1:0,sub0:0,sub1:0,ew:0});
  const eAvg=A.pax0>0?A.ew/A.pax0:null;
  const dtOpt=eAvg!=null&&Math.abs(eAvg)>0?((1+Math.abs(eAvg))/(2*Math.abs(eAvg))-1)*100:null;
  const cost0=A.rev0+A.sub0;
  const K=[
   ['Применённая эластичность',eAvg==null?'—':nf(eAvg,2),'средневзвешенная по пассажиропотоку',null],
   ['Изменение тарифа',(dt>=0?'+':'')+nf(dt,0)+'%','сценарий',null],
   ['Изменение пассажиропотока',(A.pax0>0?((A.pax1/A.pax0-1)>=0?'+':''):'')+nf(A.pax0>0?(A.pax1/A.pax0-1)*100:0,1)+'%',
     fPax(A.pax1)+' против '+fPax(A.pax0),null],
   ['Изменение выручки',(A.rev0>0&&A.rev1>=A.rev0?'+':'')+nf(A.rev0>0?(A.rev1/A.rev0-1)*100:0,1)+'%',
     fRub(A.rev1)+' руб.',null],
   ['Потребность в бюджетной поддержке',fRub(A.sub1)+' руб.',
     (A.sub0>0&&A.sub1<=A.sub0?'−':'+')+nf(A.sub0>0?Math.abs(A.sub1/A.sub0-1)*100:0,1)+'% к текущей',null],
   ['Уровень тарифного покрытия',nf(cost0>0?A.rev1/cost0*100:0,1)+'%','было '+nf(cost0>0?A.rev0/cost0*100:0,1)+'%',null],
   ['Тариф максимума выручки',dtOpt==null?'—':(dtOpt>=0?'+':'')+nf(dtOpt,0)+'%','при линейной функции спроса',null]
  ];
  /* сценарная кривая по шагам изменения тарифа */
  const grid=[-20,-15,-10,-5,0,5,10,15,20,25,30,40];
  const curve=grid.map(g=>{const p=regs.map(i=>elScenario(i,y,g,eSel(i))).filter(Boolean);
    const s=p.reduce((a,x)=>({pax:a.pax+x.pax1,rev:a.rev+x.rev1,sub:a.sub+x.sub1}),{pax:0,rev:0,sub:0});return s});
  const base=curve[grid.indexOf(0)]||{pax:1,rev:1,sub:1};
  const sCurve=[
   {name:'Пассажиропоток',color:'#C0392B',values:curve.map(c=>base.pax>0?c.pax/base.pax*100:0)},
   {name:'Выручка от перевозок',color:'#17784A',values:curve.map(c=>base.rev>0?c.rev/base.rev*100:0)},
   {name:'Потребность в бюджетной поддержке',color:'#C77A0A',values:curve.map(c=>base.sub>0?c.sub/base.sub*100:0)}];
  /* коэффициенты по субъектам */
  const bars=regs.map(i=>({n:REGIONS[i].n,v:eSel(i)})).filter(x=>x.v!=null)
    .sort((a,b)=>a.v-b.v).slice(0,MOB()?14:26);
  /* наблюдаемая связь: изменение реального тарифа и пассажиропотока */
  const sp=RAILREGS.map(i=>{
    if(!MYEARS.includes(y-1))return null;
    const a=agg([i],'rail',y,allMonths(y)),b=agg([i],'rail',y-1,allMonths(y-1));
    if(!(a.pax>0&&b.pax>0&&b.tar>0))return null;
    const t1=a.tar/(1+(MRF.cpi[y]||0)/100);
    return {n:REGIONS[i].n,x:(t1/b.tar-1)*100,y:(a.pax/b.pax-1)*100,
      r:3+Math.min(Math.sqrt(REGIONS[i].p)*1.7,9),c:'#C0392B'}}).filter(Boolean);
  const cur=(S.msort&&S.msort.k)||'e';
  const rows=msort(regs.map(i=>{const e=eSel(i),s=elScenario(i,y,dt,e),a=agg([i],'rail',y,allMonths(y));
    return {i,n:REGIONS[i].n,e,tar:a.tar,pax:a.pax,
      dq:s?s.dq:null,dRev:s?s.dRev:null,dSub:s?s.dSub:null,opt:s?s.dtOpt:null,
      arc:arcElast(i,y)}}),'e');
  const srcName={own:'единый коэффициент / загрузка',arc:'дуговая оценка из рядов дашборда'};
  return head('Эластичность спроса по цене',
    `Влияние тарифного решения на пассажиропоток, выручку и потребность в бюджетной поддержке. Коэффициенты эластичности задаются извне — дашборд их не рассчитывает, а применяет.`)
  +`<div class="callout"><b>Как пользоваться.</b> Введите свой коэффициент — он применится ко всем субъектам выборки, либо загрузите CSV «субъект — коэффициент», чтобы задать разные значения по регионам.
   Режим «дуговая оценка» считает эластичность из рядов самого дашборда: отношение изменения пассажиропотока к изменению тарифа, приведённого к ценам предыдущего года по ИПЦ. Пока данные модельные, эта оценка отражает заложенные в модель соотношения, а не наблюдаемое поведение спроса.</div>`
  +mBar(`<div class="fld"><span>Источник коэффициента</span><div class="seg" id="fElSrc">
      <button data-s="own" aria-pressed="${S.elsrc==='own'}">Свой</button>
      <button data-s="arc" aria-pressed="${S.elsrc==='arc'}">Дуговая оценка</button></div></div>
    <label class="fld"><span>Коэффициент</span><input type="text" id="fElVal" value="${nf(S.elVal,2)}" style="width:92px" ${S.elsrc==='arc'?'disabled':''}></label>
    <label class="fld"><span>Изменение тарифа</span><select id="fElDt">${grid.map(g=>`<option value="${g}"${g===dt?' selected':''}>${g>=0?'+':''}${g} %</option>`).join('')}</select></label>`,false)
  +(parts.length?`<div class="tablo">${K.map(x=>`<div class="cell"><div class="lab">${x[0]}</div><div class="val">${x[1]}</div>
    <div class="unit">${x[2]}</div></div>`).join('')}</div>`
   :`<div class="note-in" style="margin-bottom:16px">Для выбранного года и источника коэффициенты не определены, сценарий не рассчитан. Введите свой коэффициент, загрузите файл или выберите год, для которого есть предыдущий период сравнения.</div>`)
  +`<div class="grid g32">
    <div class="card"><h3>Сценарная кривая: реакция на изменение тарифа</h3>
      <p class="note">Индексы к текущему уровню (100 = ${y} год), ${esc(mLabel())}. Затраты перевозчика приняты постоянными, поэтому кривая поддержки — зеркало кривой выручки</p>
      ${legend(sCurve)}${lineChart(grid.map(g=>(g>=0?'+':'')+g+'%'),sCurve,v=>nf(v,0))}</div>
    <div class="card"><h3>Коэффициенты по субъектам</h3>
      <p class="note">Источник: ${srcName[S.elsrc]}${bars.length<regs.length?`; показаны ${bars.length} из ${regs.length}`:''}</p>
      ${bars.length?hbar(bars,v=>nf(v,2)):'<div class="note-in">Коэффициенты не заданы.</div>'}</div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Наблюдаемая связь тарифа и пассажиропотока</h3>
      <p class="note">Изменение ${y} года к ${y-1}: по горизонтали — реальный тариф (дефлированный ИПЦ), по вертикали — пассажиропоток. Наклон пунктирной линии и есть средняя дуговая эластичность по выборке</p>
      ${sp.length?scatterS(sp,'Изменение реального тарифа, %','Изменение пассажиропотока, %',v=>nf(v,1)+'%',v=>nf(v,1)+'%')
        :'<div class="note-in">Для выбранного года нет предыдущего периода сравнения.</div>'}</div>
    <div class="card"><h3>Загрузка собственных коэффициентов</h3>
      <p class="note">CSV с разделителем «точка с запятой», кодировка UTF-8</p>
      <div class="bar" style="padding-bottom:8px">
        <div class="fld"><span>Шаблон</span><button class="ghost" id="btnElTpl">Скачать шаблон</button></div>
        <div class="fld"><span>Свой файл</span><input type="file" id="fElFile" accept=".csv,text/csv" style="font-size:12.5px"></div>
        ${ELAST?'<div class="fld"><span>Сброс</span><button class="ghost" id="btnElReset">Очистить</button></div>':''}
      </div>
      <div class="note-in">Две колонки: <span style="font-family:var(--mono)">Субъект; Коэффициент эластичности спроса по цене</span>.
      Знак сохраняйте отрицательным. ${ELAST?`<b>Загружено значений: ${ELAST.size}.</b>`:'Сейчас применяется единый коэффициент из поля выше.'}</div>
      <h3 style="margin-top:18px">Справочные диапазоны</h3>
      <p class="note">Ориентиры транспортного планирования, приводятся только для проверки порядка величины собственного расчёта</p>
      <div class="tw short"><table><tbody>${ELREF.map(r=>`<tr><td class="w" style="text-align:left">${esc(r[0])}</td>
        <td class="num" style="color:var(--amber)">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>
      <div class="note-in" style="margin-top:10px">Значения приведены как ориентиры и не являются результатом расчёта по российским данным. Ваш собственный коэффициент имеет приоритет.</div></div>
  </div>
  <div class="grid" style="margin-top:16px"><div class="card">
    <h3>Результат сценария по субъектам: тариф ${dt>=0?'+':''}${dt} %, ${y} год</h3>
    <p class="note">Δ выручки и Δ потребности в поддержке рассчитаны при неизменных затратах перевозчика. Столбец «тариф максимума выручки» получен экстраполяцией линейной функции спроса далеко за пределы наблюдаемого диапазона цен и годится для оценки направления, а не как обоснование конкретного тарифа</p>
    <p class="scrollhint">Таблица прокручивается по горизонтали →</p>
    <div class="tw"><table><thead><tr>
      ${mth('n','Субъект',cur)}${mth('e','Эластичность',cur)}${mth('arc','Дуговая оценка',cur)}${mth('tar','Тариф, руб.',cur)}
      ${mth('pax','Пассажиры, тыс.',cur)}${mth('dq','Δ пассажиров, %',cur)}${mth('dRev','Δ выручки, %',cur)}
      ${mth('dSub','Δ поддержки, %',cur)}${mth('opt','Δ тарифа максимума выручки, %',cur)}
    </tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.n)}</td>
      <td class="num" style="color:var(--amber)">${r.e==null?'—':nf(r.e,2)}</td>
      <td class="num" style="color:var(--mute)">${r.arc==null?'—':nf(r.arc,2)}</td>
      <td class="num">${nf(r.tar,1)}</td><td class="num">${nf(r.pax,0)}</td>
      <td class="num">${r.dq==null?'—':(r.dq>=0?'+':'')+nf(r.dq,1)}</td>
      <td class="num">${r.dRev==null?'—':(r.dRev>=0?'+':'')+nf(r.dRev,1)}</td>
      <td class="num">${r.dSub==null?'—':(r.dSub>=0?'+':'')+nf(r.dSub,1)}</td>
      <td class="num">${r.opt==null?'—':(r.opt>=0?'+':'')+nf(r.opt,0)}</td></tr>`).join('')}

function render(){
  document.getElementById('nav').innerHTML=navHtml();
  const main=document.getElementById('main');
  const noModeNeeded=['data','method','overview','profile','tariff-reg','rail-ppk','rail-fleet','rail-subsidy','rail-share',
    'macro','budget-cap','elasticity'];
  main.innerHTML=(modeIds().length||noModeNeeded.includes(S.page))?P[S.page]()
    :head('Не выбран вид транспорта','Отметьте хотя бы один вид транспорта в фильтре.')+filters();
  window.scrollTo({top:0,behavior:'instant'});
  bind();
}
function bind(){
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;render()});
  const y=document.getElementById('fYear'); if(y)y.onchange=e=>{S.year=+e.target.value;render()};
  const r=document.getElementById('fReg'); if(r)r.onchange=e=>{S.reg=e.target.value;render()};
  document.querySelectorAll('#fGran button').forEach(b=>b.onclick=()=>{S.gran=b.dataset.g;render()});
  document.querySelectorAll('#fBase button').forEach(b=>b.onclick=()=>{S.unitBase=b.dataset.b;render()});
  document.querySelectorAll('#fModes .chip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.m;S.modes.has(id)?S.modes.delete(id):S.modes.add(id);
    if(!S.modes.size)S.modes.add(id);render()});
  const pf=document.getElementById('fProf'); if(pf)pf.onchange=e=>{S.prof=+e.target.value;render()};
  document.querySelectorAll('.fCmp').forEach(s=>s.onchange=e=>{S.cmp[+e.target.dataset.j]=+e.target.value;render()});
  document.querySelectorAll('#main th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;S.sort=(S.sort.k===k)?{k,dir:-S.sort.dir}:{k,dir:(k==='n'||k==='d')?1:-1};render()});
  const c=document.getElementById('btnCsv'); if(c)c.onclick=()=>exportCsv(false);
  const t=document.getElementById('btnTpl'); if(t)t.onclick=()=>exportCsv(true);
  const f=document.getElementById('fFile'); if(f)f.onchange=importCsv;
  const rs=document.getElementById('btnReset'); if(rs)rs.onclick=()=>{OVERRIDE=null;cache.clear();render()};
  const eo=document.getElementById('edOpenBtn'); if(eo)eo.onclick=()=>edOpen();
  const et=document.getElementById('edOpenTar'); if(et)et.onclick=()=>edOpen('tariffFacts');
  /* --- макроэкономический блок, бюджетная обеспеченность, эластичность --- */
  const my=document.getElementById('fMYear'); if(my)my.onchange=e=>{S.myear=+e.target.value;render()};
  const mr=document.getElementById('fMReg'); if(mr)mr.onchange=e=>{S.mreg=e.target.value;render()};
  document.querySelectorAll('#main th[data-mk]').forEach(th=>th.onclick=()=>{const k=th.dataset.mk;
    S.msort=(S.msort&&S.msort.k===k)?{k,dir:-S.msort.dir}:{k,dir:(k==='n'||k==='d'||k==='st')?1:-1};render()});
  document.querySelectorAll('#fElSrc button').forEach(b=>b.onclick=()=>{S.elsrc=b.dataset.s;render()});
  const ev=document.getElementById('fElVal');
  if(ev)ev.onchange=e=>{const v=parseFloat(String(e.target.value).replace(',','.').replace(/[\u2212\u2013\u2014]/,'-'));
    if(isFinite(v))S.elVal=v;render()};
  const ed=document.getElementById('fElDt'); if(ed)ed.onchange=e=>{S.eldt=+e.target.value;render()};
  const mcs=document.getElementById('btnMacroCsv'); if(mcs)mcs.onclick=()=>exportMacroCsv(false);
  const mtp=document.getElementById('btnMacroTpl'); if(mtp)mtp.onclick=()=>exportMacroCsv(true);
  const mfl=document.getElementById('fMacroFile'); if(mfl)mfl.onchange=importMacroCsv;
  const mrs=document.getElementById('btnMacroReset'); if(mrs)mrs.onclick=()=>{MACRO_OVR=null;mcache.clear();render()};
  const etp=document.getElementById('btnElTpl'); if(etp)etp.onclick=exportElCsv;
  const efl=document.getElementById('fElFile'); if(efl)efl.onchange=importElCsv;
  const ers=document.getElementById('btnElReset'); if(ers)ers.onclick=()=>{ELAST=null;render()};
}
const CSV_HEAD=['Субъект','Федеральный округ','Вид транспорта','Год','Месяц','Пассажиры, тыс.','Парк, ед.',
 'Субсидия федеральная, млн руб.','Субсидия региональная, млн руб.','Тариф, руб.','Средняя дальность, км'];
function exportCsv(template){
  const rows=[CSV_HEAD];
  const regs=S.reg==='RF'?REGIONS.map((_,i)=>i):selRegs();
  for(const ri of regs)for(const m of MODES)for(let mm=1;mm<=LASTM[S.year];mm++){
    const c=cell(ri,m.id,S.year,mm);
    rows.push([REGIONS[ri].n,REGIONS[ri].d,m.n,S.year,mm,
      template?'':c.pax.toFixed(1),template?'':c.park,template?'':c.fed.toFixed(3),
      template?'':c.reg.toFixed(3),template?'':c.tar.toFixed(2),template?'':c.dist.toFixed(1)]);

  b.gratisSh=b.rev>0?b.gratis/b.rev*100:0; b.debtN=b.nnd>0?b.debt/b.nnd*100:0;
  b.t0408Sh=b.exp>0?b.t0408/b.exp*100:0; return b}

const edVal = (c, row) => (c.g ? c.g(row) : row[c.k]);
function edCell(rk, i, ci) {
  const R = REFS[rk], c = R.cols[ci], row = R.rows()[i], v = edVal(c, row);
  const a = `data-rk="${rk}" data-i="${i}" data-c="${ci}"`;
  if (c.type === 'ro') return `<td class="ro" style="min-width:${c.w || 120}px">${eq(v)}</td>`;
  if (c.type === 'sel') {
    const cur = v == null ? '' : String(v);
    const opts = c.opts().map(String);
    const list = opts.indexOf(cur) < 0 ? [cur].concat(opts) : opts;
    return `<td class="ed"><select ${a}>${list.map(o =>
      `<option value="${eq(o)}"${o === cur ? ' selected' : ''}>${eq(c.lab && c.lab[o] ? c.lab[o] : (o || '—'))}</option>`).join('')}</select></td>`;
  }
  if (c.type === 'num')
    return `<td class="ed"><input type="text" inputmode="decimal" ${a} value="${eq(edNum(v))}"></td>`;
  return `<td class="ed txt" style="min-width:${c.w || 180}px"><input type="text" ${a} value="${eq(v)}"></td>`;
}
function edSet(rk, i, ci, raw) {
  const R = REFS[rk], c = R.cols[ci], row = R.rows()[i];
  if (!row || c.type === 'ro') return false;
  let v;
  if (c.type === 'num') {
    const t = String(raw).trim();
    if (t === '') v = c.nul ? null : 0;
    else { v = edParse(t); if (v == null) { alert('Нужно число — например 26,1'); return false; } }
  } else v = String(raw);
  if (c.s) c.s(row, v); else row[c.k] = v;
  if (R.after) R.after();
  ED.edits++; recalcAll();
  return true;
}
function edCsv(rk) {
  const R = REFS[rk];
  const out = [R.cols.map(c => c.t)];
  R.rows().forEach(r => out.push(R.cols.map(c => {
    const v = edVal(c, r); return c.type === 'num' ? edNum(v) : (v == null ? '' : String(v));
  })));
  const csv = '\uFEFF' + out.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'spravochnik-' + rk + '.csv'; a.click(); URL.revokeObjectURL(a.href);
}
function edHtml() {
  const rk = REFS[ED.ref] ? ED.ref : 'anchor'; ED.ref = rk;
  const R = REFS[rk], rows = R.rows(), q = (ED.q || '').trim().toLowerCase();
  const idx = rows.map((_, i) => i).filter(i => !q ||
    R.cols.some(c => String(edVal(c, rows[i]) == null ? '' : edVal(c, rows[i])).toLowerCase().indexOf(q) >= 0));
  return `<div class="ed-hint">${R.hint}</div>
    <div class="tw"><table><thead><tr><th class="nos" style="min-width:34px">№</th>
      ${R.cols.map(c => `<th class="nos">${eq(c.t)}</th>`).join('')}
      ${R.del ? '<th class="nos" style="min-width:74px">Строка</th>' : ''}</tr></thead><tbody>
      ${idx.map(i => `<tr><td class="ro" style="color:var(--mute)">${i + 1}</td>
        ${R.cols.map((c, ci) => edCell(rk, i, ci)).join('')}
        ${R.del ? `<td class="ro" style="text-align:center;white-space:nowrap">
          <button class="ghost xs" data-eddup="${i}" title="Дублировать строку">⧉</button>
          <button class="ghost xs" data-eddel="${i}" title="Удалить строку">✕</button></td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    ${idx.length ? '' : '<div class="note-in" style="margin-top:10px">По этому запросу строк нет — очистите поиск.</div>'}`;
}
function edPaint() {
  const pick = document.getElementById('edPick');
  if (pick) pick.innerHTML = Object.keys(REFS).map(k =>

function edBind() {
  document.querySelectorAll('#edBody [data-rk]').forEach(el => {
    el.onchange = () => { edSet(el.dataset.rk, +el.dataset.i, +el.dataset.c, el.value); edPaint(); render(); };
    if (el.tagName === 'INPUT') el.onkeydown = e => { if (e.key === 'Enter') el.blur(); };
  });
  document.querySelectorAll('#edBody [data-eddup]').forEach(b => b.onclick = () => {
    const R = REFS[ED.ref], rows = R.rows(), i = +b.dataset.eddup, r = rows[i];
    rows.splice(i + 1, 0, Array.isArray(r) ? r.slice() : Object.assign({}, r));

    const R = REFS[ED.ref], rows = R.rows(), i = +b.dataset.eddel;

    rows.splice(i, 1); if (R.after) R.after();
    ED.edits++; recalcAll(); edPaint(); render();
  });
}

const setArr = (a, v) => { if (!Array.isArray(v)) return; a.length = 0; v.forEach(x => a.push(x)); };
const setObj = (o, v) => { if (!v || typeof v !== 'object') return; for (const k in o) delete o[k]; Object.assign(o, v); };
function applyEdits(E) {

  setObj(ANCHOR, E.anchor); setArr(TARIFF_DEC, E.tariffDec); setArr(FED_INDEX, E.fedIndex); setArr(REGIONS, E.regions); setArr(EC, E.ec);
  setObj(DOT25, E.dot25); setObj(DOT_IDX, E.dotidx); setArr(TARIFF_FACTS, E.tariffFacts);
  setObj(QUAL, E.qual); setObj(SEAS, E.seas); setObj(LASTM, E.lastm);
  setArr(PPK, E.ppk); setArr(SERIES, E.series); setObj(CURMIX, E.curmix);
  setObj(MRF, E.mrf); setObj(MQUAL, E.mqual); setArr(FACTS_2025, E.facts2025);
  setArr(RAIL_FACTS, E.railFacts); setArr(SOURCES, E.sources); setArr(ELREF, E.elref);

function saveDash() {
  try {
    const clone = document.documentElement.cloneNode(true);
    const m = clone.querySelector('#main'); if (m) m.innerHTML = '';
    const n = clone.querySelector('#nav'); if (n) n.innerHTML = '';
    const b = clone.querySelector('#edBody'); if (b) b.innerHTML = '';
    const w = clone.querySelector('#edWrap'); if (w) w.setAttribute('hidden', '');
    const pl = clone.querySelector('#edits');
    if (!pl) { alert('Не найден блок правок — сохранение невозможно.'); return; }
    pl.textContent = 'const EDITS=' + JSON.stringify(collectEdits()) + ';';
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
                  String(d.getDate()).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + clone.outerHTML],
      { type: 'text/html;charset=utf-8' }));
    a.download = 'prigorodnye-perevozki-dashboard-' + stamp + '.html'; a.click();
    URL.revokeObjectURL(a.href);
    ED.edits = 0; edPaint();
    alert('Файл скачан — правки внутри него. Дальше работайте со скачанной копией.');
  } catch (err) { alert('Не удалось сохранить: ' + err.message); }
}
/* пересчёт всех производных величин после правки исходных данных */
function recalcAll() {
  DISTRICTS = [...new Set(REGIONS.map(r => r.d))];
  PPK_IDX = PPK.map(p => ({ ...p, ri: (p.r || []).map(n => REGIONS.findIndex(x => x.n === n)).filter(i => i >= 0) }));
  REG_PPK = REGIONS.map((_, i) => PPK_IDX.filter(p => p.ri.includes(i)));
  SUM = buildSUM();
  RAILREGS = REGIONS.map((r, i) => i).filter(i => REGIONS[i].r > 0);
  RAILSET = new Set(RAILREGS);
  NORAIL = REGIONS.filter(r => !(r.r > 0)).map(r => r.n);
  cache.clear();
  MDIST = [...new Set(RAILREGS.map(i => REGIONS[i].d))];
  MNORM = buildMNORM(); mcache.clear();
  MSCALE = buildMSCALE();
}

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ED.open) edClose(); });
  window.addEventListener('beforeunload', ev => {
    if (ED.edits) { ev.preventDefault(); ev.returnValue = ''; return ''; }
  });
}

if(applyEdits(typeof EDITS!=='undefined'?EDITS:null))recalcAll();
edInit();
render();
/* при повороте экрана и изменении ширины геометрия графиков меняется — перерисовываем */
let rzT=null, lastMob=MOB(), lastW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  const m=MOB();if(m!==lastMob||Math.abs(window.innerWidth-lastW)>120){lastMob=m;lastW=window.innerWidth;render()}},220)});
</script>
</body>
